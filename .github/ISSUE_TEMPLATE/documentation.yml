name: Documentation correction
description: Report inaccurate, incomplete, or unclear current documentation.
title: "docs: "
labels: []
body:
  - type: input
    id: location
    attributes:
      label: Document location
      placeholder: Path or URL
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Current problem
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Recommended correction
    validations:
      required: true
